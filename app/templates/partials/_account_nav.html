{% if current_user.can_access_admin %}
<a class="nav-link logout-link" href="{{ url_for('admin.index') }}"><span>⚙</span> Admin panel</a>
{% endif %}
<form class="logout-form" method="post" action="{{ url_for('auth.logout') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button class="nav-link logout-link" type="submit"><span>↪</span> Sign out</button>
</form>
